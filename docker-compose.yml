services:
  subtitle-translator:
    build: .
    image: subtitle-translator:latest
    container_name: subtitle-translator
    restart: unless-stopped
    # Host-specific values live in .env (copy .env.example). Don't edit this file on
    # the server, so updates stay a plain `git pull && docker compose up -d --build`.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    volumes:
      - ./config:/config
      - "${MEDIA_PATH:?Set MEDIA_PATH in .env (see .env.example)}:/media"
    ports:
      # Plain HTTP: never port-forward this to the internet.
      - "${HOST_PORT:-8790}:8790"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - translate

  # Optional: bundled LibreTranslate. Enable it with COMPOSE_PROFILES=libretranslate in .env
  # and use http://libretranslate:5000 as the URL in the setup wizard.
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    profiles: ["libretranslate"]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: "${LT_LOAD_ONLY:-en,fr,de,es,nl}"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    networks:
      - translate

networks:
  # Private network between the two containers. LibreTranslate publishes no ports,
  # so it is only reachable from the subtitle-translator container. (Not "internal",
  # because LibreTranslate downloads its language models on first start.)
  translate: {}

volumes:
  libretranslate-models:
